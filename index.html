<!doctype html><html>
  <head>
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>レシート家計簿</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: one phone-width column — month summary on top, a big capture button, review sheet, then the month's receipt list */
:root{
  --bg:#f3f5f4; --paper:#ffffff; --ink:#1d2a2e; --mute:#66757a; --line:#d9e0de;
  --accent:#1f6f78; --accent-ink:#ffffff;
  --c-proc:#d4762c; --c-mat:#3f8f4a; --c-oth:#7d7f9c;
  --danger:#b23a3a;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141a1c; --paper:#1c2427; --ink:#e4ecea; --mute:#93a3a5; --line:#2e3a3d;
  --accent:#4fb3bd; --accent-ink:#0e1a1c;
  --c-proc:#ec9a57; --c-mat:#6cc077; --c-oth:#a3a6c8; --danger:#e57373; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141a1c; --paper:#1c2427; --ink:#e4ecea; --mute:#93a3a5; --line:#2e3a3d;
  --accent:#4fb3bd; --accent-ink:#0e1a1c;
  --c-proc:#ec9a57; --c-mat:#6cc077; --c-oth:#a3a6c8; --danger:#e57373; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,label.cap:focus-within{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-direction:column;gap:12px}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:8px}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:.04em}
.monthnav{display:flex;align-items:center;gap:4px}
.monthnav button{border:1px solid var(--line);background:var(--paper);color:var(--ink);width:34px;height:34px;border-radius:8px}
.monthnav span{min-width:92px;text-align:center;font-weight:700}

.summary{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.total{display:flex;align-items:baseline;justify-content:space-between}
.total small{color:var(--mute);font-size:12px;letter-spacing:.08em}
.total b{font-size:28px;font-weight:600}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%;transition:width .3s}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cat{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mute)}
.cat em{font-style:normal;display:flex;align-items:center;gap:6px}
.cat em::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c)}
.cat b{font-size:15px;color:var(--ink);font-weight:500}

label.cap{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px;font-weight:700;font-size:17px;cursor:pointer;user-select:none}
label.cap input{position:absolute;opacity:0;width:1px;height:1px}
label.cap svg{width:24px;height:24px}
label.cap.busy{opacity:.6;pointer-events:none}
.hint{font-size:12px;color:var(--mute);margin:-8px 0 0;text-align:center}
.notice{font-size:13px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;color:var(--mute)}
.notice.err{color:var(--danger);border-color:var(--danger)}

/* review sheet */
.review{background:var(--paper);border:2px solid var(--accent);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.review h2{margin:0;font-size:15px}
.rv-head{display:flex;gap:12px;align-items:flex-start}
.rv-head img{width:64px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none}
.fields{display:grid;grid-template-columns:1fr;gap:8px;flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--mute)}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.items{display:flex;flex-direction:column;border-top:1px dashed var(--line)}
.item{display:grid;grid-template-columns:1fr 84px 88px;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.item input,.item select{padding:6px 8px;font-size:14px}
.item .p{text-align:right}
.item select{border-left:4px solid var(--c)}
.rv-sums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.check{font-size:12px;color:var(--mute)}
.check.bad{color:var(--danger)}
.row-btns{display:flex;gap:8px}
.row-btns button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-weight:700}
.row-btns .primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.additem{align-self:flex-start;background:none;border:none;color:var(--accent);font-size:13px;padding:4px 0}

/* list */
.list-head{display:flex;justify-content:space-between;align-items:center}
.list-head h2{font-size:14px;margin:0;color:var(--mute);letter-spacing:.06em}
.xl{border:1px solid var(--accent);color:var(--accent);background:var(--paper);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700}
.table-wrap{overflow-x:auto;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--mute);font-weight:500;letter-spacing:.04em}
th:nth-child(2),td:nth-child(2){text-align:left;white-space:normal;min-width:6em}
th:first-child,td:first-child{text-align:left}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--bg)}
tfoot td{font-weight:600;border-bottom:none}
td.c1{color:var(--c-proc)} td.c2{color:var(--c-mat)} td.c3{color:var(--c-oth)}
.empty{padding:28px 16px;text-align:center;color:var(--mute);font-size:13px}
.del{color:var(--danger);background:none;border:1px solid var(--danger);border-radius:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="toprow">
      <h1>レシート家計簿</h1>
      <div class="monthnav">
        <button id="prev" aria-label="前の月">‹</button>
        <span id="monthLabel">—</span>
        <button id="next" aria-label="次の月">›</button>
      </div>
    </div>
    <div class="summary">
      <div class="total"><small>今月の合計</small><b class="num" id="sumTotal">¥0</b></div>
      <div class="bar"><i id="barP" style="background:var(--c-proc);width:0"></i><i id="barM" style="background:var(--c-mat);width:0"></i><i id="barO" style="background:var(--c-oth);width:0"></i></div>
      <div class="cats">
        <div class="cat" style="--c:var(--c-proc)"><em>加工品</em><b class="num" id="sumP">¥0</b></div>
        <div class="cat" style="--c:var(--c-mat)"><em>材料</em><b class="num" id="sumM">¥0</b></div>
        <div class="cat" style="--c:var(--c-oth)"><em>その他</em><b class="num" id="sumO">¥0</b></div>
      </div>
    </div>
  </header>

  <label class="cap" id="capLabel">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
    <span id="capText">レシートを撮る</span>
    <input type="file" id="photo" accept="image/*" capture="environment">
  </label>
  <p class="hint">撮影するとAIが日付・店名・品目を読み取り、加工品／材料／その他に振り分けます。</p>
  <div class="notice" id="notice" hidden></div>

  <section class="review" id="review" hidden>
    <h2 id="rvTitle">読み取り結果を確認</h2>
    <div class="rv-head">
      <img id="rvImg" alt="撮影したレシート" hidden>
      <div class="fields">
        <label class="field">日付<input type="date" id="rvDate"></label>
        <label class="field">店名<input type="text" id="rvStore" placeholder="店名"></label>
      </div>
    </div>
    <div class="items" id="rvItems"></div>
    <button class="additem" id="addItem">＋ 品目を追加</button>
    <div class="rv-sums">
      <div class="cat" style="--c:var(--c-proc)"><em>加工品</em><b class="num" id="rvP">¥0</b></div>
      <div class="cat" style="--c:var(--c-mat)"><em>材料</em><b class="num" id="rvM">¥0</b></div>
      <div class="cat" style="--c:var(--c-oth)"><em>その他</em><b class="num" id="rvO">¥0</b></div>
    </div>
    <div class="check" id="rvCheck"></div>
    <div class="row-btns">
      <button id="rvDelete" class="del" hidden>削除</button>
      <button id="rvCancel">やめる</button>
      <button id="rvSave" class="primary">保存</button>
    </div>
  </section>

  <section style="display:flex;flex-direction:column;gap:8px">
    <div class="list-head"><h2 id="listTitle">今月のレシート</h2><button class="xl" id="exportBtn">Excelに出力</button></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>日付</th><th>店名</th><th>加工品</th><th>材料</th><th>その他</th></tr></thead>
        <tbody id="rows"></tbody>
        <tfoot id="foot"></tfoot>
      </table>
      <div class="empty" id="empty">読み込み中…</div>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
const $ = id => document.getElementById(id);
const CATS = ["加工品","材料","その他"];
const CATVAR = {"加工品":"var(--c-proc)","材料":"var(--c-mat)","その他":"var(--c-oth)"};
const yen = n => "¥" + Math.round(n||0).toLocaleString("ja-JP");
const pad = n => String(n).padStart(2,"0");
const today = new Date();
let curYM = today.getFullYear() + "-" + pad(today.getMonth()+1);
let records = [];          // [{id, date, store, items, proc, mat, oth, total}]
let col = null;            // db collection (null = not saving)
let sample = null, downloads = null;
let draft = null;          // {id?, date, store, items, total?, img?}

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),2200); }
function notice(msg, err){ const n=$("notice"); n.hidden=!msg; n.textContent=msg||""; n.classList.toggle("err",!!err); }
function sums(items){ const s={proc:0,mat:0,oth:0}; for(const it of items){ const p=Number(it.price)||0; if(it.category==="加工品")s.proc+=p; else if(it.category==="材料")s.mat+=p; else s.oth+=p; } s.total=s.proc+s.mat+s.oth; return s; }
function ymLabel(ym){ const [y,m]=ym.split("-"); return `${y}年${Number(m)}月`; }
function shiftMonth(d){ let [y,m]=curYM.split("-").map(Number); m+=d; if(m<1){m=12;y--;} if(m>12){m=1;y++;} curYM=y+"-"+pad(m); render(); }

/* ---------- render month ---------- */
function render(){
  $("monthLabel").textContent = ymLabel(curYM);
  $("listTitle").textContent = ymLabel(curYM) + "のレシート";
  const rows = records.filter(r => (r.date||"").startsWith(curYM)).sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:0));
  const s={proc:0,mat:0,oth:0}; rows.forEach(r=>{s.proc+=r.proc;s.mat+=r.mat;s.oth+=r.oth;});
  const tot=s.proc+s.mat+s.oth;
  $("sumTotal").textContent=yen(tot); $("sumP").textContent=yen(s.proc); $("sumM").textContent=yen(s.mat); $("sumO").textContent=yen(s.oth);
  $("barP").style.width=(tot?s.proc/tot*100:0)+"%"; $("barM").style.width=(tot?s.mat/tot*100:0)+"%"; $("barO").style.width=(tot?s.oth/tot*100:0)+"%";
  const tb=$("rows"); tb.textContent="";
  for(const r of rows){
    const tr=document.createElement("tr");
    const cells=[r.date.slice(5).replace("-","/"), r.store||"（店名なし）", yen(r.proc), yen(r.mat), yen(r.oth)];
    cells.forEach((v,i)=>{ const td=document.createElement("td"); td.textContent=v; if(i!==1)td.className="num"+(i>1?" c"+(i-1):""); tr.appendChild(td); });
    tr.onclick=()=>openReview({...r, items:(r.items||[]).map(x=>({...x}))});
    tb.appendChild(tr);
  }
  const ft=$("foot"); ft.textContent="";
  if(rows.length){ const tr=document.createElement("tr"); ["合計",rows.length+"件",yen(s.proc),yen(s.mat),yen(s.oth)].forEach((v,i)=>{const td=document.createElement("td");td.textContent=v;td.className=i!==1?"num"+(i>1?" c"+(i-1):""):"";tr.appendChild(td);}); ft.appendChild(tr); }
  const em=$("empty");
  em.hidden = rows.length>0;
  if(!rows.length) em.textContent = col===undefined ? "読み込み中…" : "この月のレシートはまだありません。上のボタンから撮影して追加できます。";
}

/* ---------- review sheet ---------- */
function openReview(d){
  draft=d;
  $("rvTitle").textContent = d.id ? "レシートを編集" : "読み取り結果を確認";
  $("rvDate").value=d.date||""; $("rvStore").value=d.store||"";
  const img=$("rvImg"); if(d.img){img.src=d.img;img.hidden=false;} else img.hidden=true;
  $("rvDelete").hidden=!d.id; $("rvDelete").textContent="削除"; $("rvDelete").dataset.arm="";
  drawItems(); $("review").hidden=false;
  $("review").scrollIntoView({behavior:"smooth",block:"start"});
}
function drawItems(){
  const box=$("rvItems"); box.textContent="";
  draft.items.forEach((it,i)=>{
    const row=document.createElement("div"); row.className="item";
    const n=document.createElement("input"); n.value=it.name||""; n.id="it-n-"+i; n.setAttribute("aria-label","品名"); n.oninput=()=>{it.name=n.value;};
    const p=document.createElement("input"); p.type="number"; p.inputMode="numeric"; p.className="p num"; p.id="it-p-"+i; p.value=it.price??""; p.setAttribute("aria-label","金額"); p.oninput=()=>{it.price=Number(p.value)||0; updSums();};
    const c=document.createElement("select"); c.id="it-c-"+i; c.setAttribute("aria-label","区分");
    CATS.forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=k;c.appendChild(o);});
    c.value=CATS.includes(it.category)?it.category:"その他"; it.category=c.value; c.style.setProperty("--c",CATVAR[c.value]);
    c.onchange=()=>{it.category=c.value;c.style.setProperty("--c",CATVAR[c.value]);updSums();};
    row.append(n,p,c); box.appendChild(row);
  });
  updSums();
}
function updSums(){
  const s=sums(draft.items);
  $("rvP").textContent=yen(s.proc); $("rvM").textContent=yen(s.mat); $("rvO").textContent=yen(s.oth);
  const ck=$("rvCheck");
  if(draft.total && Math.round(draft.total)!==Math.round(s.total)){ ck.textContent=`品目の合計 ${yen(s.total)} ／ レシートの合計 ${yen(draft.total)}（差額 ${yen(draft.total-s.total)}）。金額を確認してください。`; ck.className="check bad"; }
  else { ck.textContent=`合計 ${yen(s.total)}`; ck.className="check"; }
}
$("addItem").onclick=()=>{ draft.items.push({name:"",price:0,category:"その他"}); drawItems(); };
$("rvCancel").onclick=()=>{ $("review").hidden=true; draft=null; };
$("rvSave").onclick=async()=>{
  const date=$("rvDate").value; if(!date){ toast("日付を入れてください"); return; }
  const items=draft.items.filter(it=>(it.name||"").trim()||Number(it.price));
  const s=sums(items);
  const body={date, ym:date.slice(0,7), store:$("rvStore").value.trim(), items:items.map(it=>({name:it.name||"",price:Number(it.price)||0,category:it.category})), proc:s.proc, mat:s.mat, oth:s.oth, total:s.total, updatedAt:new Date().toISOString()};
  $("rvSave").disabled=true;
  try{
    if(col){ await col.doc(draft.id||undefined).set(body); }
    else { const id=draft.id||("local-"+Date.now()); records=records.filter(r=>r.id!==id); records.push({id,...body}); }
    curYM=body.ym; $("review").hidden=true; draft=null; render(); toast("保存しました");
  }catch(e){ toast("保存できませんでした。もう一度お試しください"); }
  finally{ $("rvSave").disabled=false; }
};
$("rvDelete").onclick=async()=>{
  const b=$("rvDelete");
  if(!b.dataset.arm){ b.dataset.arm="1"; b.textContent="本当に削除"; return; }
  try{ if(col) await col.doc(draft.id).delete(); else records=records.filter(r=>r.id!==draft.id); $("review").hidden=true; draft=null; render(); toast("削除しました"); }
  catch(e){ toast("削除できませんでした"); }
};

/* ---------- capture + AI ---------- */
async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,ng)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ng;i.src=url;});
    const max=1600, k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
    const cv=document.createElement("canvas"); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
    cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    const blob=await new Promise(ok=>cv.toBlob(ok,"image/jpeg",0.85));
    const thumb=cv.toDataURL("image/jpeg",0.5);
    return {blob,thumb};
  } finally { URL.revokeObjectURL(url); }
}
const PROMPT = () => `あなたは日本のレシートを読み取る家計簿アシスタントです。画像のレシートを読み取り、JSONだけを返してください。

形式:
{"date":"YYYY-MM-DD","store":"店名","total":税込合計金額(数値),"items":[{"name":"品名","price":税込金額(数値),"category":"加工品"|"材料"|"その他"}]}

区分のルール:
- 加工品: 調理せずに食べられる／温めるだけの食品。惣菜、弁当、パン、お菓子、飲料、酒、冷凍食品、カップ麺、レトルト、豆腐・納豆・ハム・ソーセージなどの加工食品
- 材料: 料理に使う食材と調味料。野菜、果物、肉、魚、卵、米、麺(乾麺・生麺)、小麦粉、牛乳、バター、チーズ、調味料、油
- その他: 食品以外。日用品、洗剤、雑貨、レジ袋代など

金額のルール:
- 値引き・割引は該当する品目の金額から差し引く
- 外税表示の場合は、消費税を各品目に按分して税込金額にする（品目の合計がtotalと一致するように）
- 数量がある場合は小計(単価×数量)を1品目として記載
- 年が読めない場合は${today.getFullYear()}年とする。読めない値は空文字または0`;

$("photo").onchange=async(e)=>{
  const file=e.target.files[0]; e.target.value="";
  if(!file) return;
  if(!sample){ notice("AI読み取りが使えない環境です。Claudeにログインした状態で開くと使えます。",true); return; }
  const lab=$("capLabel"); lab.classList.add("busy"); $("capText").textContent="AIが読み取り中…"; notice("");
  try{
    const {blob,thumb}=await shrink(file);
    const r=await sample.json(PROMPT(),{images:[blob],cache:false});
    const items=Array.isArray(r?.items)?r.items.map(it=>({name:String(it.name||""),price:Number(it.price)||0,category:CATS.includes(it.category)?it.category:"その他"})):[];
    const date=/^\d{4}-\d{2}-\d{2}$/.test(r?.date||"")?r.date:`${today.getFullYear()}-${pad(today.getMonth()+1)}-${pad(today.getDate())}`;
    if(!items.length) items.push({name:"",price:Number(r?.total)||0,category:"その他"});
    openReview({date,store:String(r?.store||""),items,total:Number(r?.total)||0,img:thumb});
  }catch(err){
    const c=err&&err.code;
    notice(c==="not_granted"?"AIの利用が許可されませんでした。もう一度撮影すると確認が表示されます。":
           c==="rate_limited"?"混み合っています。少し待ってからもう一度撮影してください。":
           c==="invalid_json"?"レシートを読み取れませんでした。明るい場所で、レシート全体が入るように撮り直してください。":
           c==="cancelled"?"":"読み取りに失敗しました。もう一度撮影してください。", c!=="cancelled");
  }finally{ lab.classList.remove("busy"); $("capText").textContent="レシートを撮る"; }
};

/* ---------- Excel export ---------- */
$("exportBtn").onclick=async()=>{
  if(!records.length){ toast("出力するレシートがありません"); return; }
  if(typeof XLSX==="undefined"){ toast("Excel機能を読み込めませんでした"); return; }
  const wb=XLSX.utils.book_new();
  const months=[...new Set(records.map(r=>r.date.slice(0,7)))].sort();
  for(const ym of months){
    const rows=records.filter(r=>r.date.startsWith(ym)).sort((a,b)=>a.date<b.date?-1:1);
    const aoa=[["日付","店名","加工品","材料","その他","合計"]];
    rows.forEach(r=>aoa.push([r.date.replaceAll("-","/"),r.store,r.proc,r.mat,r.oth,r.total]));
    const n=rows.length+1;
    aoa.push(["合計","",{f:`SUM(C2:C${n})`},{f:`SUM(D2:D${n})`},{f:`SUM(E2:E${n})`},{f:`SUM(F2:F${n})`}]);
    const ws=XLSX.utils.aoa_to_sheet(aoa);
    ws["!cols"]=[{wch:12},{wch:22},{wch:10},{wch:10},{wch:10},{wch:11}];
    for(let R=1;R<=n;R++) for(let C=2;C<=5;C++){ const a=XLSX.utils.encode_cell({r:R,c:C}); if(ws[a]) ws[a].z="#,##0"; }
    XLSX.utils.book_append_sheet(wb,ws,ymLabel(ym));
  }
  const data=XLSX.write(wb,{type:"array",bookType:"xlsx"});
  const fname=`家計簿_${today.getFullYear()}${pad(today.getMonth()+1)}${pad(today.getDate())}.xlsx`;
  if(!downloads){ toast("この環境ではファイルを保存できません"); return; }
  try{ await downloads.save({filename:fname,data:new Blob([data],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"})}); toast("Excelを保存しました"); }
  catch(e){ if(e?.code!=="declined") toast("Excelを保存できませんでした"); }
};

$("prev").onclick=()=>shiftMonth(-1);
$("next").onclick=()=>shiftMonth(1);
col=undefined; render();

/* ---------- capabilities ---------- */
(async()=>{
  const C=window.claude;
  if(!C||!C.use){ col=null; render(); notice("このページはClaudeの中で開くと、AI読み取りと保存が使えます。"); return; }
  C.use("sample").then(s=>{ sample=s; });
  C.use("downloads").then(d=>{ downloads=d; });
  const [db,user]=await Promise.all([C.use("db"),C.use("user")]);
  if(!db||!user){ col=null; render(); notice("いまは保存できない状態です（Claudeにログインして開くと保存されます）。入力した内容はこの画面を閉じると消えます。"); return; }
  try{
    const uid=await user.id();
    col=db.collection("data/users/"+uid);
    col.onSnapshot(snap=>{
      records=snap.docs.map(d=>({id:d.id,...d.data()})).filter(r=>r.date);
      render();
    },()=>{ notice("データの読み込みが止まりました。ページを開き直してください。",true); });
  }catch(e){ col=null; render(); notice("保存先に接続できませんでした。",true); }
})();
</script>
